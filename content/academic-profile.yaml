internships:
  - id: ucla-reu-2018
    dates: Jul 2018 - Aug 2018
    organization: UCLA
    role: Computational and Applied Math Research Experience for Undergrads (REU)
    subtitle: Undergraduate Researcher in Mycofluidics Lab
    description: Worked in Professor Marcus Roper's lab on imaging of fungal cells in Neurospora and Ashbya fungal species. Collected data on nuclear division of these multinucleated cells using 3D imaging algorithms and performed data analysis on nuclear spacing and mixing within the cell. Discovered that genetically incompatible fungal strains fuse together when exposed to environmental stress. We are working on a paper that relies on the research findings and imaging algorithms I developed at UCLA.
  - id: ai2-2017
    dates: Jun 2017 - Sep 2017
    organization: Allen Institute for Artificial Intelligence (AI2)
    role: Engineering Intern
    subtitle: Full Stack Development and Data Analysis/Visualization
    description: Collaborated with researchers and built a system which optimized hyperparameter selection in various neural network experiments run in the company. I was responsible for experiment design decisions and execution of these experiments on a Google cluster. My platform significantly simplified the experimentation process and reduced runtime by a factor of two.
  - id: abbyy-2016
    dates: Aug 2016 - Dec 2016
    organization: ABBYY
    role: Natural Language Processing Intern
    subtitle: Parser Accuracy Scoring
    description: Compared ABBYY's parser efficiency and output to that of MaltParser. Created scripts in Java to read parser output from CoNLL-X data files and scored them using unlabeled and labeled attachment scores (UAS and LAS). Used Excel for visualization and graphing.
  - id: pfizer-2016
    dates: Jun 2016 - Aug 2016
    organization: Pfizer
    role: Image Analysis Intern
    subtitle: Imaging Algorithms for Automated Brain Slice Imaging
    description: Worked in the Neuroscience Pain Research Unit at Pfizer. Studied how various drugs help regenerate healthy cells damaged by neurodegenerative diseases, especially Parkinson's. Used image analysis algorithms, particularly 3D Watershed Segmentation, to quantify the percentage of regenerated healthy cells after treatment. My automated imaging pipeline was used by researchers to quantify hundreds of drug profiles and reduced the runtime of their image analysis code by 10 times.

