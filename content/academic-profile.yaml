teaching:
  - id: caltech-acm270
    category: instructor
    code: ACM 270
    institution: California Institute of Technology
    institution_short: Caltech
    role: Instructor of Record
    term: Spring 2025
    title: Data-Driven Modeling of Dynamical Systems
    url: "https://schedules.caltech.edu/syllabi/ACM270_SP2425.pdf"
    resume_subtitle: Designer and Instructor of New Course for Data-Driven Modeling of Dynamical Systems
    responsibility: Two weekly 1.5 hour classes with 30+ students, with final presentations and projects. Designed all course content and lectures and graded final projects.
    resume_detail: Two weekly 1.5 hour classes with 30+ students, with final presentations and projects, unifying topics in system identification, sparse model inference, Koopman theory, adjoint methods, data assimilation, and scientific ML. Turning class content and lectures into a class text.
    overview: >-
      Dynamical systems are a ubiquitous tool for modeling time-dependent processes in science and engineering. Progress in machine learning methods in the past two decades has been tremendous, giving rise to the field of scientific machine learning which combines data-driven methods with physical modeling techniques. This course covers pivotal data-driven algorithms and model architectures for more accurate model inference, forecasting, and analysis of dynamical data, with special focus on partially observed systems. Topics include system identification, Koopman theory, sparse model inference, neural ODEs, signature transforms, autoregressive models, Volterra equations, Mori-Zwanzig formalism, and higher-order models.
  - id: mit-18032
    category: teaching_assistant
    code: MIT 18.032
    institution: Massachusetts Institute of Technology
    institution_short: MIT
    role: Teaching Assistant
    term: Spring 2022
    title: Differential Equations
    url: "http://student.mit.edu/catalog/search.cgi?search=18.032&style=verbatim"
    resume_subtitle: Teaching Assistant for Differential Equations (theory focused)
    responsibility: Two weekly 1 hour recitations with 16 students, including grading of homeworks/finals and proctoring final exams.
    resume_detail: Two weekly 1 hour recitations with 16 students, including grading of homeworks/finals and proctoring final exams. Covering existence and uniqueness theory (Cauchy-Lipschitz Theorem, Picard iterations), control and comparison of solutions, maximal solutions, Grönwall's Lemma, multivariable ODEs, and fixed point stability.
    overview: >-
      The class 18.032 is centered around ordinary differential equations with more emphasis on theory than 18.03. Topics include first and higher-order ODEs, existence and uniqueness of solutions, Picard iterations, Euler schemes, control and comparison of solutions, maximal solutions, dependence on initial conditions, Grönwall's Lemma, multivariable ODEs, and fixed point stability.
  - id: mit-18600
    category: teaching_assistant
    code: MIT 18.600
    institution: Massachusetts Institute of Technology
    institution_short: MIT
    role: Teaching Assistant
    term: Fall 2021
    title: Introduction to Probability
    url: "http://student.mit.edu/catalog/search.cgi?search=18.600&style=verbatim"
    resume_subtitle: Teaching Assistant for Introduction to Probability
    responsibility: Two weekly 1 hour recitations with 40 students, including grading of homeworks and finals.
    resume_detail: Two weekly 1 hour recitations with 40 students, including grading of homeworks and finals. Covering probability spaces, random variables, classes of distributions, Bayes theorem, Chebyshev inequality, law of large numbers, and central limit theorems.
    overview: >-
      The class 18.600 is an introductory probability theory course. Topics include probability spaces, random variables, distribution functions, standard discrete and continuous distributions, conditional probability, Bayes theorem, joint distributions, Chebyshev inequality, the law of large numbers, and the central limit theorem.

