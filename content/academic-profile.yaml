  headline:
    - Incoming Assistant Professor, Department of Applied Mathematics and Theoretical Physics, University of Cambridge
  recruitment_announcement:
    lead: I am recruiting PhD students and postdocs to join my team at Cambridge DAMTP starting in Fall 2027.
    text: >-
      My group will develop methods at the forefront of scientific machine learning, computer-assisted mathematics, data-driven dynamics, and optimal transport, with a goal to accelerate model inference and prediction in complex physical systems. Students and researchers with a strong background in mathematics and computation who are interested in learning more about my group are very welcome to reach out. Useful links for those interested in PhD studies or postdoctoral work at Cambridge DAMTP can be found below:
    links:
      - label: DAMTP PhD Program
        url: "https://www.postgraduate.study.cam.ac.uk/courses/directory/maampdmtp"
      - label: Cambridge Postdoc Fellowship Programs
        url: "https://www.newtontrust.cam.ac.uk/ECFs"
      - label: External Postdoc Fellowship Programs
        url: "https://www.damtp.cam.ac.uk/externally-funded-opportunities"
  announcement: >-
    Starting in October 2026, I will join the faculty at the University of Cambridge as an Assistant Professor in Mathematics of Information in the [Department of Applied Mathematics and Theoretical Physics (DAMTP)](https://www.damtp.cam.ac.uk/). I will spend the 2026-2027 academic year as visiting faculty at [New York University's Courant Institute](https://math.nyu.edu/).
  biography:
    - >-
      I am an [NSF MSPRF](https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2402074&HistoricalAwards=false) postdoctoral fellow at the California Institute of Technology in the [Department of Computing and Mathematical Sciences](https://www.cms.caltech.edu/) working with [Prof. Andrew Stuart](http://stuart.caltech.edu/).
    - >-
      I received my PhD from the Massachusetts Institute of Technology (MIT) in 2024 in the [Department of Mathematics](https://math.mit.edu/) co-advised by [Prof. Philippe Rigollet](https://math.mit.edu/~rigollet/) and [Prof. Jörn Dunkel](https://math.mit.edu/~dunkel/) funded by the [NSF GRFP](https://www.nsf.gov/awardsearch/show-award/?AWD_ID=1745302) and MIT Presidential Fellowship. I was also part of the [Interdisciplinary Doctoral Program in Statistics (IDPS)](https://stat.mit.edu/academics/idps/) through the [Institute for Data, Systems, and Society (IDSS)](https://idss.mit.edu/). I received the [Lawrence D. Brown PhD Student Award](https://imstat.org/2025/04/02/preview-george-stepaniants-ims-lawrence-d-brown-phd-student-lecture/) in 2025 from the Institute of Mathematical Statistics for my statistical work on the optimal transport Gromov-Wasserstein method and its applications to metabolomics.
    - >-
      Prior to MIT, I graduated in 2019 from the University of Washington with a Bachelor of Science in Mathematics and Computer Science, where I performed research in the [Department of Applied Mathematics](https://amath.washington.edu/) with [Prof. Nathan Kutz](http://faculty.washington.edu/kutz/).
  summary: >-
    I have broad interests in scientific machine learning, computer-assisted mathematics, dynamical systems, and optimal transport. My research develops methods for efficient and accurate model inference and prediction in complex physical systems, backed by rigorous analysis, approximation bounds, and statistical guarantees.
  research_areas:
    - Applied and Computational Mathematics
    - Statistical Theory and Methods
    - High-Dimensional Statistics
    - Machine Learning
    - Scientific Computing
    - Numerical Analysis
    - Scientific ML
    - Mechanics of Materials
    - Fluid Dynamics
    - Biophysics
  research_mission:
    question: How do we develop physically faithful models and solve inverse problems when data are collected from disparate sources, sample-limited and noisy, or only available as partial observations of a larger system?
    thrusts:
      - label: I
        lead: Advancement of statistical and machine learning methods to learn governing physical laws from data
        detail: in noisy and data-sparse regimes, with analytical, approximation theoretic, and statistical guarantees
      - label: II
        lead: Development of optimal transport techniques for alignment and pooling of scientific data
        detail: from disparate sources, with rigorous finite-sample guarantees
      - label: III
        lead: Advancing mathematical theory and numerical algorithms for inverse problems
        detail: with applications to spatial and temporal deconvolution and to systems with nonlocal and long-range interactions
    closing: The methodological and theoretical developments in these three thrusts are guided by my work in specific application domains including biochemistry, materials science, and fluid mechanics.
  teaching_philosophy:
    intro: My goal as an educator is to teach students how to work on the interface of different disciplines and leverage tools from mathematical theory in physics, life sciences, probability theory, and statistics to solve their problems. My teaching philosophy is to train students to
    principles:
      - Identify promising ideas or undeveloped theories in domain-specific literature
      - Translate these ideas into precise theoretical frameworks
      - Bring these frameworks to life as numerical algorithms and reproducible code
    closing: I am dedicated to mentoring and student outreach, and am taking important steps in education, research mentorship, and outreach in academia as well as in my local communities. I continue to expand my outreach and service in communities that historically have had less access to education in mathematics and science.

