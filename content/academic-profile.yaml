publications:
  - id: mit-thesis
    category: thesis
    title: Inference from Limited Observations in Statistical, Dynamical, and Functional Problems
    authors: [George Stepaniants]
    venue: Massachusetts Institute of Technology
    citation_detail: "(2024)."
    year: 2024
    url: "https://dspace.mit.edu/handle/1721.1/155887?show=full"
    research_card: false
  - id: forsythe-complete-resolution
    category: preprint
    title: A Complete Resolution of Forsythe's Conjecture for Restarted Conjugate Gradients
    authors: [Matthew J. Colbrook, George Stepaniants, Alex Townsend]
    venue: "arXiv preprint arXiv:2609.04659"
    citation_detail: "(2026)."
    card_venue: arXiv preprint
    year: 2026
    url: "https://arxiv.org/abs/2609.04659"
    published_date: September 4, 2026
    # Figure 1, Zenodo record 22289731, page 4. Captured from the PDF at 240 dpi.
    image: forsythe_complete_resolution.png
    thumbnail:
      crop: [0, 0, 746, 578]
      padding: 8
      alt: Contours within the parameter rectangle of limiting two-cycles at restart length three, with four orange corner points
    image_alt: Limiting two-cycle geometry at restart length three alongside a transverse Hopf crossing at restart length four
    image_caption: "Figure 1. The threshold mechanism: the parameter rectangle of limiting two-cycles for restart length three (left), and a numerical reconstruction of the certified transverse Hopf crossing for restart length four (right)."
    groups: [other]
    research_card: true
    abstract_label: Summary
    abstract: >-
      We give a complete classification of Forsythe's conjecture by restart length for exact-arithmetic restarted conjugate gradients on finite-dimensional symmetric positive definite problems. For restart lengths two and three, every iteration either terminates or has even and odd normalized residual directions that converge separately. Combined with the classical result for restart length one, this establishes the conjecture precisely for restart lengths one, two, and three. For every restart length s of four or more, we construct a diagonal positive definite counterexample of dimension s + 4 whose even residual directions do not converge. The proof combines a double-orthogonality identity and low-degree fixed-set analysis with a computer-certified Hopf bifurcation, analytic periodic-orbit and shadowing arguments, and degree elevation. A Lean formalization also verifies the classification for all restart lengths of two or more.
    keywords: [conjugate gradient method, restarted Krylov method, Forsythe conjecture, orthogonal polynomials, Hopf bifurcation, computer-assisted proof]
  - id: berenstein-counterexample
    category: preprint
    title: A computer-assisted counterexample to the planar Berenstein conjecture
    authors: [Matthew J. Colbrook, Siavash Sadeghi, George Stepaniants]
    venue: "arXiv preprint arXiv:2608.08953"
    citation_detail: "(2026)."
    card_venue: arXiv preprint
    year: 2026
    url: "https://arxiv.org/abs/2608.08953"
    published_date: August 9, 2026
    # Figure 1, arXiv:2608.08953v1, page 3. Captured from the PDF at 240 dpi.
    image: berenstein.png
    thumbnail:
      crop: [14, 8, 774, 648]
      padding: 8
    image_alt: Sign-changing eigenfunction on a noncircular domain with thirteen-fold rotational symmetry, with nodal curves and a color scale
    image_caption: "Figure 1. Numerical approximation to the sign-changing eigenfunction on the Berenstein counterexample domain."
    groups: [ip]
    research_card: true
    abstract_label: Summary
    abstract: >-
      We construct a noncircular, simply connected planar domain with an analytic boundary that supports a sign-changing Helmholtz eigenfunction with zero boundary values and a constant nonzero normal derivative. This gives a counterexample to the unrestricted planar Berenstein conjecture. The domain has thirteen-fold rotational symmetry and is not centrally symmetric. Building on the conformal and disk-polynomial framework developed for the Pompeiu and Schiffer problems, we formulate a coupled interior-boundary system on the unit disc. Bounds on the infinite-dimensional tail and an interval-arithmetic verification of a Newton-Kantorovich argument establish the existence of an exact solution near the computed approximation.
    keywords: [Berenstein conjecture, overdetermined eigenvalue problems, spectral geometry, computer-assisted proof, interval arithmetic]
  - id: forsythe-conjecture
    category: preprint
    title: A Proof of the Forsythe Conjecture for the Two-Step Restarted Conjugate Gradient Method
    authors: [Matthew J. Colbrook, George Stepaniants, Alex Townsend]
    venue: "arXiv preprint arXiv:2608.02852"
    citation_detail: "(2026)."
    card_venue: arXiv preprint
    year: 2026
    url: "https://arxiv.org/abs/2608.02852"
    published_date: August 3, 2026
    # Figure 1, arXiv:2608.02852v1, page 4. Captured from the PDF at 240 dpi.
    image: forsythe.png
    thumbnail:
      crop: [14, 4, 365, 284]
      padding: 8
      alt: Even and odd restarted conjugate-gradient trajectories approaching two limiting directions
    image_alt: Even and odd restarted conjugate-gradient trajectories approach two limiting directions, while their distances to those limits decay to roundoff
    image_caption: "Figure 1. Two-step restarted conjugate gradients: residual trajectories and convergence to the even and odd limiting states."
    groups: [other]
    research_card: true
    abstract_label: Summary
    abstract: >-
      We resolve the two-step case of Forsythe's 1968 conjecture on the asymptotic behavior of restarted conjugate gradients. For a symmetric positive definite system, restarting after every two iterations produces normalized residuals whose even and odd subsequences each approach a limit, provided the iteration does not terminate. Thus the residual directions asymptotically settle into a two-cycle.
    keywords: [conjugate gradient method, restarted Krylov method, Forsythe conjecture, orthogonal polynomials, asymptotic residual directions]
  - id: pompeiu-schiffer-counterexample
    category: preprint
    title: A computer-assisted counterexample to the planar Pompeiu and Schiffer conjectures
    authors: [Matthew J. Colbrook, George Stepaniants]
    venue: "arXiv preprint arXiv:2608.01579"
    citation_detail: "(2026)."
    card_venue: arXiv preprint
    year: 2026
    url: "https://arxiv.org/abs/2608.01579"
    published_date: August 3, 2026
    # Figure 1, arXiv:2608.01579v1, page 3. Captured from the PDF at 240 dpi.
    image: pompeiu_schiffer.png
    thumbnail:
      crop: [5, 8, 785, 758]
      padding: 14
    image_alt: Ten-lobed, noncircular shortcake-shaped domain forming a counterexample to the planar Pompeiu and Schiffer conjectures
    image_caption: "Figure 1. Boundary of the finite conformal approximation to the ten-lobed counterexample domain."
    groups: [ip]
    research_card: true
    abstract_label: Summary
    abstract: >-
      We give a computer-assisted construction of a noncircular, simply connected planar domain with an analytic boundary and a nonconstant Neumann eigenfunction that is constant on the boundary. The domain disproves the planar Schiffer conjecture and, through Green's identity, also the corresponding Pompeiu conjecture. Its boundary has ten-fold rotational symmetry and closely follows an explicitly specified polynomial conformal map. Transferring the problem to the unit disc yields an operator equation in a disk-polynomial basis. Rigorous coefficient estimates and control of the infinite-dimensional tails establish an exact solution near the numerical approximation.
    keywords: [Pompeiu problem, Schiffer conjecture, spectral geometry, conformal mapping, computer-assisted proof]
  - id: memory-material-laws
    category: journal
    title: Learning Memory and Material Dependent Constitutive Laws
    authors: [Kaushik Bhattacharya, Lianghao Cao, George Stepaniants, Andrew M. Stuart, Margaret Trautner]
    alphabetical_order: true
    venue: The SMAI Journal of Computational Mathematics
    citation_detail: "12 (2026): 219-267."
    card_venue: SMAI Journal of Computational Mathematics
    year: 2026
    url: "https://smai-jcm.centre-mersenne.org/articles/10.5802/smai-jcm.148/"
    published_date: June 12, 2026
    image: mem_mat.png
    thumbnail:
      crop: [360, 22, 664, 456]
      padding: 8
      alt: Stress-response heatmaps comparing a model without memory with the learned memory-dependent response
    groups: [de, other]
    research_card: true
    abstract: >-
      We propose and study a neural operator framework for learning memory- and material microstructure-dependent constitutive laws for heterogeneous materials. We work in the two-scale setting where homogenization theory provides a systematic approach to deriving macroscale constitutive laws, obviating the need to resolve complex microstructure repeatedly. However, the unit cell problems defining these constitutive models are typically not amenable to explicit evaluation. It is therefore of interest to learn constitutive models from data generated by the unit cell problem. Our proposed framework models homogenized constitutive laws with both memory- and microstructure-dependence through the use of Markovian recurrent and Fourier neural operators. The homogenization problem for Kelvin-Voigt viscoelastic materials is studied to provide firm theoretical foundations for our model. The theoretical properties of the cell problem in this Kelvin-Voigt setting motivate the proposed learning framework; and are also used to prove a universal approximation theorem for the learned macroscale constitutive model. Numerical experiments show that the proposed learning framework accurately learns memory- and microstructure-dependent viscoelastic and elasto-viscoplastic constitutive models, beyond the setting of the theory. Furthermore, we show that the learned constitutive models can be successfully deployed in macroscale simulation of material deformation for different microstructures without retraining.
    keywords: [constitutive modeling, homogenization, memory, microstructure, Kelvin-Voigt, viscoelasticity, elasto-viscoplasticity, neural operator]
  - id: spectral-volterra
    category: journal
    title: A Spectral Theory of Scalar Volterra Equations
    authors: [David Darrow, George Stepaniants]
    alphabetical_order: true
    venue: Communications of the American Mathematical Society
    citation_detail: "6 (2026): 634-725."
    card_venue: Communications of the AMS
    year: 2026
    url: "https://doi.org/10.1090/cams/64"
    published_date: May 20, 2026
    image: spectral_volterra.png
    thumbnail:
      crop: [320, 30, 835, 610]
      padding: 8
      alt: Three spectral distributions and their computed and analytic Hilbert transforms
    groups: [de, ip]
    research_card: true
    abstract: >-
      This work aims to bridge the gap between pure and applied research on scalar, linear Volterra equations by examining five major classes: integral and integro-differential equations with completely monotone kernels (viscoelastic models); equations with positive definite kernels (partially observed quantum systems); difference equations with discrete, positive definite kernels; a generalized class of delay differential equations; and a generalized class of fractional differential equations. We develop a general, spectral theory that provides a system of correspondences between these disparate domains. As a result, we see how 'interconversion' (operator inversion) arises as a natural, continuous involution within each class, yielding a plethora of novel formulas for analytical solutions of such equations. This spectral theory unifies and extends existing results in viscoelasticity, signal processing, and analysis. It also introduces a geometric construction of the regularized Hilbert transform, revealing a fundamental connection to fractional and delay differential equations. Finally, it offers a practical toolbox for Volterra equations of all classes, reducing many to pen-and-paper calculations and introducing a powerful spectral approach for general Volterra equations based on rational approximation.
    keywords: [Volterra integral equations, constitutive modeling, fractional derivatives, delay differential equations]
  - id: covariance-alignment
    category: journal
    title: "Covariance alignment: from maximum likelihood estimation to Gromov-Wasserstein"
    authors: [Yanjun Han, Philippe Rigollet, George Stepaniants]
    alphabetical_order: true
    venue: SIAM Journal on Mathematics of Data Science
    citation_detail: "7.3 (2025): 1491-1513."
    card_venue: SIMODS
    year: 2025
    url: "https://epubs.siam.org/doi/full/10.1137/24M1682841"
    published_date: September 17, 2025
    image: mle_gw.png
    thumbnail:
      crop: [532, 18, 738, 538]
      padding: 8
      alt: Fiedler and Gromov-Wasserstein covariance estimates alongside the true covariance
    groups: [ot]
    research_card: true
    abstract: >-
      Feature alignment methods are used in many scientific disciplines for data pooling, annotation, and comparison. As an instance of a permutation learning problem, feature alignment presents significant statistical and computational challenges. In this work, we propose the covariance alignment model to study and compare various alignment methods and establish a minimax lower bound for covariance alignment that has a non-standard dimension scaling because of the presence of a nuisance parameter. This lower bound is in fact minimax optimal and is achieved by a natural quasi MLE. However, this estimator involves a search over all permutations which is computationally infeasible even when the problem has moderate size. To overcome this limitation, we show that the celebrated Gromov-Wasserstein algorithm from optimal transport which is more amenable to fast implementation even on large-scale problems is also minimax optimal. These results give the first statistical justification for the deployment of the Gromov-Wasserstein algorithm in practice.
    keywords: [Feature alignment, graph matching, optimal transport, Gromov-Wasserstein]
  - id: hidden-dynamics
    category: journal
    title: Discovering dynamics and parameters of nonlinear oscillatory and chaotic systems from partial observations
    authors: [George Stepaniants, Alasdair D. Hastewell, Dominic J. Skinner, Jan F. Totz, Jörn Dunkel]
    equal_contribution: [George Stepaniants, Alasdair D. Hastewell]
    venue: Physical Review Research
    citation_detail: "6, 043062 (2024)."
    card_venue: PRR
    year: 2024
    url: "https://journals.aps.org/prresearch/abstract/10.1103/PhysRevResearch.6.043062"
    published_date: October 23, 2024
    image: hdi.png
    thumbnail:
      crop: [14, 8, 686, 496]
      padding: 8
      alt: Reconstructed time series, discovered coefficients, and a Lorenz attractor
    groups: [de, ip]
    research_card: true
    abstract: >-
      Despite rapid progress in data acquisition techniques, many complex physical, chemical, and biological systems remain only partially observable, thus posing the challenge to identify valid theoretical models and estimate their parameters from an incomplete set of experimentally accessible time series. Here, we combine sensitivity methods and ranked-choice model selection to construct an automated hidden dynamics inference framework that can discover predictive nonlinear dynamical models for both observable and latent variables from noise-corrupted incomplete data in oscillatory and chaotic systems. After validating the framework for prototypical FitzHugh-Nagumo oscillations, we demonstrate its applicability to experimental data from squid neuron activity measurements and Belousov-Zhabotinsky reactions, as well as to the Lorenz system in the chaotic regime.
    keywords: [Dynamical systems, hidden variables, sensitivity methods, nonlinear oscillations, chaotic dynamics]
  - id: metabolomics-alignment
    category: journal
    title: Optimal transport for automatic alignment of untargeted metabolomic data
    authors: [Marie Breeur, George Stepaniants, Pekka Keski-Rahkonen, Philippe Rigollet, Vivian Viallon]
    equal_contribution: [Marie Breeur, George Stepaniants]
    venue: eLife
    citation_detail: "12:RP91597 (2024)."
    card_venue: eLife
    year: 2024
    url: "https://elifesciences.org/articles/91597"
    published_date: June 18, 2024
    image: gw.png
    thumbnail:
      crop: [24, 38, 1116, 580]
      padding: 8
      alt: Two metabolomics datasets aligned through a constrained Gromov-Wasserstein coupling
    groups: [ot]
    research_card: true
    abstract: >-
      Untargeted metabolomic profiling through liquid chromatography-mass spectrometry (LC-MS) measures a vast array of metabolites within biospecimens, advancing drug development, disease diagnosis, and risk prediction. However, the low throughput of LC-MS poses a major challenge for biomarker discovery, annotation, and experimental comparison, necessitating the merging of multiple datasets. Current data pooling methods encounter practical limitations due to their vulnerability to data variations and hyperparameter dependence. Here, we introduce GromovMatcher, a flexible and user-friendly algorithm that automatically combines LC-MS datasets using optimal transport. By capitalizing on feature intensity correlation structures, GromovMatcher delivers superior alignment accuracy and robustness compared to existing approaches. This algorithm scales to thousands of features requiring minimal hyperparameter tuning. Manually curated datasets for validating alignment algorithms are limited in the field of untargeted metabolomics, and hence we develop a dataset split procedure to generate pairs of validation datasets to test the alignments produced by GromovMatcher and other methods. Applying our method to experimental patient studies of liver and pancreatic cancer, we discover shared metabolic features related to patient alcohol intake, demonstrating how GromovMatcher facilitates the search for biomarkers associated with lifestyle risk factors linked to several cancer types.
    keywords: [Gromov-Wasserstein, optimal transport, metabolomics, data integration]
  - id: pde-rkhs
    category: journal
    title: Learning partial differential equations in reproducing kernel Hilbert spaces
    authors: [George Stepaniants]
    venue: Journal of Machine Learning Research
    citation_detail: "24.86 (2023): 1-72."
    card_venue: JMLR
    year: 2023
    url: "https://jmlr.org/papers/v24/21-1363.html"
    published_date: January 25, 2023
    image: pde_rkhs.png
    thumbnail:
      crop: [754, 10, 705, 612]
      padding: 8
      alt: Smooth RKHS estimate of the Green's function, with axes and a color scale
    groups: [de, ip]
    research_card: true
    abstract: >-
      We propose a new data-driven approach for learning the fundamental solutions (Green's functions) of various linear partial differential equations (PDEs) given sample pairs of input-output functions. Building off the theory of functional linear regression (FLR), we estimate the best-fit Green's function and bias term of the fundamental solution in a reproducing kernel Hilbert space (RKHS) which allows us to regularize their smoothness and impose various structural constraints. We derive a general representer theorem for operator RKHSs to approximate the original infinite-dimensional regression problem by a finite-dimensional one, reducing the search space to a parametric class of Green's functions. In order to study the prediction error of our Green's function estimator, we extend prior results on FLR with scalar outputs to the case with functional outputs. Finally, we demonstrate our method on several linear PDEs including the Poisson, Helmholtz, Schrödinger, Fokker-Planck, and heat equation. We highlight its robustness to noise as well as its ability to generalize to new data with varying degrees of smoothness and mesh discretization without any additional training.
    keywords: [Green's functions, partial differential equations, reproducing kernel Hilbert spaces, functional linear regression, simultaneous diagonalization]
  - id: gulp
    category: conference
    title: "GULP: a prediction-based metric between representations"
    authors: [Enric Boix-Adserà, Hannah Lawrence, George Stepaniants, Philippe Rigollet]
    venue: Advances in Neural Information Processing Systems
    citation_detail: "(2022)."
    card_venue: NeurIPS
    year: 2022
    url: "https://arxiv.org/abs/2210.06545"
    published_date: October 12, 2022
    image: gulp.png
    thumbnail:
      crop: [457, 31, 564, 321]
      padding: 8
      alt: GULP representation comparisons at three regularization levels, colored by network width and depth
    groups: [other]
    research_card: true
    abstract: >-
      Comparing the representations learned by different neural networks has recently emerged as a key tool to understand various architectures and ultimately optimize them. In this work, we introduce GULP, a family of distance measures between representations that is explicitly motivated by downstream predictive tasks. By construction, GULP provides uniform control over the difference in prediction performance between two representations, with respect to regularized linear prediction tasks. Moreover, it satisfies several desirable structural properties, such as the triangle inequality and invariance under orthogonal transformations, and thus lends itself to data embedding and visualization. We extensively evaluate GULP relative to other methods, and demonstrate that it correctly differentiates between architecture families, converges over the course of training, and captures generalization performance on downstream linear tasks.
    keywords: [representations, CCA, CKA, transfer learning, neural networks]
  - id: wasserstein-splines
    category: conference
    title: Fast and smooth interpolation on Wasserstein space
    authors: [Sinho Chewi, Julien Clancy, Thibaut Le Gouic, Philippe Rigollet, George Stepaniants, Austin Stromme]
    alphabetical_order: true
    venue: International Conference on Artificial Intelligence and Statistics
    citation_detail: "PMLR (2021)."
    card_venue: AISTATS
    year: 2021
    url: "https://proceedings.mlr.press/v130/chewi21a"
    published_date: March 18, 2021
    image: splines.png
    thumbnail:
      crop: [40, 77, 1000, 423]
      padding: 12
      alt: Probability distributions interpolated along a Wasserstein spline
    groups: [ot]
    research_card: true
    abstract: >-
      We propose a new method for smoothly interpolating probability measures using the geometry of optimal transport. To that end, we reduce this problem to the classical Euclidean setting, allowing us to directly leverage the extensive toolbox of spline interpolation. Unlike previous approaches to measure-valued splines, our interpolated curves (i) have a clear interpretation as governing particle flows, which is natural for applications, and (ii) come with the first approximation guarantees on Wasserstein space. Finally, we demonstrate the broad applicability of our interpolation methodology by fitting surfaces of measures using thin-plate splines.
    keywords: [optimal transport, spline interpolation, thin-plate splines]
  - id: causal-networks
    category: journal
    title: Inferring causal networks of dynamical systems through transient dynamics and perturbation
    authors: [George Stepaniants, Bingni W. Brunton, J. Nathan Kutz]
    venue: Physical Review E
    citation_detail: "102.4 (2020): 042309."
    card_venue: Physical Review E
    year: 2020
    url: "https://journals.aps.org/pre/abstract/10.1103/PhysRevE.102.042309"
    published_date: October 26, 2020
    image: netinf.png
    thumbnail:
      crop: [18, 12, 570, 389]
      padding: 8
      alt: Granger-causality accuracy and spectra for three network models
    groups: [de, ip]
    research_card: true
    abstract: >-
      Inferring causal relations from time series measurements is an ill-posed mathematical problem, where typically an infinite number of potential solutions can reproduce the given data. We explore in depth a strategy to disambiguate between possible underlying causal networks by perturbing the network, where the forcings are either targeted or applied at random. The resulting transient dynamics provide the critical information necessary to infer causality. Two methods are shown to provide accurate causal reconstructions: Granger causality (GC) with perturbations, and our proposed perturbation cascade inference (PCI). Perturbed GC is capable of inferring smaller networks under low coupling strength regimes. Our proposed PCI method demonstrated consistently strong performance in inferring causal relations for small (2-5 node) and large (10-20 node) networks, with both linear and nonlinear dynamics. Thus, the ability to apply a large and diverse set of perturbations to the network is critical for successfully and accurately determining causal relations and disambiguating between various viable networks.
    keywords: [network inference, coupled oscillators, Granger causality, CCA]
  - id: sieve
    category: preparation
    title: "SIEVE: Spectral integral transforms, poly-exponential approximants, and Volterra equations"
    authors: [David Darrow, George Stepaniants, Chris Camaño]
    equal_contribution: [David Darrow, George Stepaniants]
    year: 2026
    research_card: false
  - id: lebesgue-report
    category: report
    title: The Lebesgue Integral, Chebyshev's Inequality, and the Weierstrass Approximation Theorem
    authors: [George Stepaniants]
    venue: Undergraduate Academic Report (Math 33X, University of Washington)
    citation_detail: "(2017)."
    card_venue: Undergraduate Academic Report
    year: 2017
    url: "https://sites.math.washington.edu/~morrow/336_17/papers17/george.pdf"
    published_date: June 6, 2017
    image: 33X.png
    thumbnail:
      crop: [110, 22, 633, 476]
      padding: 12
      alt: Title and table of contents of the report on Lebesgue integration
    groups: [other]
    resume: false
    site_cv: false
    research_card: true
    abstract: >-
      This paper presents Bernstein's probabilistic proof of the Weierstrass Approximation Theorem. It develops the required foundations in measure theory, Lebesgue integration, probability distributions, and Chebyshev's inequality before applying them to polynomial approximation.
    keywords: [Lebesgue integral, Chebyshev's inequality, Weierstrass approximation theorem]

